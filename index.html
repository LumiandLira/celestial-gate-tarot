<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial Gate Tarot</title>
  <style>
    :root {
      --bg-color: #0b0712;
      --card-bg: rgba(255, 255, 255, 0.05);
      --text-main: #f3e8ff;
      --text-sub: #c0a9d4;
      --accent: #d8b4fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cinzel', 'Georgia', serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      background-image: radial-gradient(circle at 50% 0%, #2e1065 0%, var(--bg-color) 70%);
      overflow-x: hidden;
    }

    /* --- INTRO SCREEN (SPLASH PORTAL) --- */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 40%, #2e1065 0%, #0b0712 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 1.2s ease, transform 1.2s ease, visibility 1.2s;
    }

    #intro-screen.hidden {
      opacity: 0;
      transform: scale(1.15);
      visibility: hidden;
    }

    .portal-card-wrapper {
      width: 220px;
      height: 380px;
      border-radius: 16px;
      border: 1px solid rgba(216, 180, 254, 0.4);
      overflow: hidden;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.4), 0 0 60px rgba(216, 180, 254, 0.2);
      cursor: pointer;
      animation: floatGlow 4s ease-in-out infinite;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .portal-card-wrapper:hover {
      transform: scale(1.03);
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.6), 0 0 80px rgba(216, 180, 254, 0.4);
    }

    .portal-card-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes floatGlow {
      0%, 100% {
        transform: translateY(0);
        box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3);
      }
      50% {
        transform: translateY(-10px);
        box-shadow: 0 20px 45px rgba(216, 180, 254, 0.5);
      }
    }

    .enter-btn {
      margin-top: 2rem;
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      color: white;
      border: none;
      padding: 0.85rem 2.2rem;
      border-radius: 30px;
      font-size: 1.1rem;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
      transition: all 0.3s ease;
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(168, 85, 247, 0.7);
    }

    /* --- MAIN APP SECTION --- */
    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(216, 180, 254, 0.4);
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 0.95rem;
      font-style: italic;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      opacity: 0;
      transition: opacity 1.5s ease 0.5s;
    }

    .container.visible {
      opacity: 1;
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    button.action-btn {
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      color: white;
      border: none;
      padding: 0.75rem 1.4rem;
      border-radius: 25px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    button.action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
    }

    button.reset-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 0.75rem 1.4rem;
      border-radius: 25px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button.reset-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* --- STANDARD GRID LAYOUT (1 & 3 CARDS) --- */
    .cards-grid {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      width: 100%;
      margin-top: 1rem;
      min-height: 380px;
    }

    .card-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      perspective: 1000px;
    }

    .card-title {
      font-size: 0.8rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* --- CELTIC CROSS LAYOUT (10 CARDS) --- */
    .celtic-cross-layout {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3rem;
      width: 100%;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    /* ฝั่งวงกากบาท (Cross) */
    .celtic-cross-circle {
      position: relative;
      width: 480px;
      height: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ตำแหน่งเจาะจงของไพ่แต่ละใบใน Celtic Cross */
    .celtic-cross-circle .card-item[data-pos="1"] { position: absolute; z-index: 1; }
    .celtic-cross-circle .card-item[data-pos="2"] { position: absolute; z-index: 2; transform: rotate(90deg) scale(0.95); }
    .celtic-cross-circle .card-item[data-pos="3"] { position: absolute; bottom: 0; }
    .celtic-cross-circle .card-item[data-pos="4"] { position: absolute; left: 0; }
    .celtic-cross-circle .card-item[data-pos="5"] { position: absolute; top: 0; }
    .celtic-cross-circle .card-item[data-pos="6"] { position: absolute; right: 0; }

    /* ฝั่งเสาขวามือ (Staff) */
    .celtic-cross-staff {
      display: flex;
      flex-direction: column-reverse; /* เรียงจากใบที่ 7 ด้านล่างขึ้นใบที่ 10 ด้านบน */
      gap: 1rem;
    }

    /* --- 3D CARD FLIP CONTAINER --- */
    .card-flip-container {
      width: 130px; /* ขนาดกะทัดรัดขึ้นเพื่อให้อ่าน Celtic Cross ง่ายบนทุกหน้าจอ */
      height: 225px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
    }

    /* ปรับขนาดใหญ่ขึ้นเวลาเปิด 1 หรือ 3 ใบ */
    .cards-grid .card-flip-container {
      width: 200px;
      height: 345px;
    }

    .card-flip-container.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 8px;
      border: 1px solid rgba(216, 180, 254, 0.25);
      overflow: hidden;
      background-color: var(--card-bg);
    }

    .card-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-back { transform: rotateY(0deg); }
    .card-front { transform: rotateY(180deg); }

    .card-name-text {
      font-size: 0.85rem;
      max-width: 140px;
      text-align: center;
      line-height: 1.2;
    }
  </style>
</head>
<body>

  <!-- 1. INTRO SPLASH SCREEN -->
  <div id="intro-screen">
    <p style="font-size: 0.85rem; color: var(--accent); letter-spacing: 4px; margin-bottom: 0.8rem;">CELESTIAL GATE TAROT</p>
    
    <div class="portal-card-wrapper" onclick="enterGate()">
      <img src="assets/major/00_Celestial_Gate.jpg" alt="Celestial Gate Entrance" onerror="handleImageError(this)">
    </div>

    <button class="enter-btn" onclick="enterGate()">ENTER THE GATE</button>
    <p style="font-size: 0.85rem; color: var(--text-sub); margin-top: 1rem; font-style: italic;">Tap the card to step through</p>
  </div>

  <!-- 2. MAIN READING SECTION -->
  <header>
    <p style="font-size: 0.8rem; color: var(--accent); letter-spacing: 3px;">CELESTIAL GATE TAROT</p>
    <h1>Celestial Oracle</h1>
    <p class="subtitle">Enter quietly. Let the cards reveal your path.</p>
  </header>

  <div class="container" id="mainContainer">
    <div class="controls">
      <button class="action-btn" onclick="drawCards(1)">Open 1 Card</button>
      <button class="action-btn" onclick="drawCards(3)">Open 3 Cards</button>
      <button class="action-btn" onclick="drawCelticCross()">Open 10 Cards (Celtic Cross)</button>
      <button class="reset-btn" onclick="resetDeck()">Reset Deck</button>
    </div>

    <div id="cardsDisplay"></div>
  </div>

  <script>
    function enterGate() {
      document.getElementById('intro-screen').classList.add('hidden');
      document.getElementById('mainContainer').classList.add('visible');
    }

    // กองไพ่ 78 ใบมาตรฐาน
    const tarotDeck = [
      // Major Arcana (22)
      { name: "The Fool", path: "assets/major/01_The_Fool.jpg" },
      { name: "The Magician", path: "assets/major/02_The_Magician.jpg" },
      { name: "The High Priestess", path: "assets/major/03_The_High_Priestess.jpg" },
      { name: "The Empress", path: "assets/major/04_The_Empress.jpg" },
      { name: "The Emperor", path: "assets/major/05_The_Emperor.jpg" },
      { name: "The Hierophant", path: "assets/major/06_The_Hierophant.jpg" },
      { name: "The Lovers", path: "assets/major/07_The_Lovers.jpg" },
      { name: "The Chariot", path: "assets/major/08_The_Chariot.jpg" },
      { name: "Strength", path: "assets/major/09_Strength.jpg" },
      { name: "The Hermit", path: "assets/major/10_The_Hermit.jpg" },
      { name: "Wheel of Fortune", path: "assets/major/11_Wheel_of_Fortune.jpg" },
      { name: "Justice", path: "assets/major/12_Justice.jpg" },
      { name: "The Hanged Man", path: "assets/major/13_The_Hanged_Man.jpg" },
      { name: "Death", path: "assets/major/14_Death.jpg" },
      { name: "Temperance", path: "assets/major/15_Temperance.jpg" },
      { name: "The Devil", path: "assets/major/16_The_Devil.jpg" },
      { name: "The Tower", path: "assets/major/17_The_Tower.jpg" },
      { name: "The Star", path: "assets/major/18_The_Star.jpg" },
      { name: "The Moon", path: "assets/major/19_The_Moon.jpg" },
      { name: "The Sun", path: "assets/major/20_The_Sun.jpg" },
      { name: "Judgement", path: "assets/major/21_Judgement.jpg" },
      { name: "The World", path: "assets/major/22_The_World.jpg" },

      // Minor Arcana - Cups (14)
      { name: "Ace of Cups", path: "assets/minor/Cups_Ace.jpg" },
      { name: "Two of Cups", path: "assets/minor/Cups_Two.jpg" },
      { name: "Three of Cups", path: "assets/minor/Cups_Three.jpg" },
      { name: "Four of Cups", path: "assets/minor/Cups_Four.jpg" },
      { name: "Five of Cups", path: "assets/minor/Cups_Five.jpg" },
      { name: "Six of Cups", path: "assets/minor/Cups_Six.jpg" },
      { name: "Seven of Cups", path: "assets/minor/Cups_Seven.jpg" },
      { name: "Eight of Cups", path: "assets/minor/Cups_Eight.jpg" },
      { name: "Nine of Cups", path: "assets/minor/Cups_Nine.jpg" },
      { name: "Ten of Cups", path: "assets/minor/Cups_Ten.jpg" },
      { name: "Page of Cups", path: "assets/minor/Cups_Page.jpg" },
      { name: "Knight of Cups", path: "assets/minor/Cups_Knight.jpg" },
      { name: "Queen of Cups", path: "assets/minor/Cups_Queen.jpg" },
      { name: "King of Cups", path: "assets/minor/Cups_King.jpg" },

      // Minor Arcana - Pentacles (14)
      { name: "Ace of Pentacles", path: "assets/minor/Pentacles_Ace.jpg" },
      { name: "Two of Pentacles", path: "assets/minor/Pentacles_Two.jpg" },
      { name: "Three of Pentacles", path: "assets/minor/Pentacles_Three.jpg" },
      { name: "Four of Pentacles", path: "assets/minor/Pentacles_Four.jpg" },
      { name: "Five of Pentacles", path: "assets/minor/Pentacles_Five.jpg" },
      { name: "Six of Pentacles", path: "assets/minor/Pentacles_Six.jpg" },
      { name: "Seven of Pentacles", path: "assets/minor/Pentacles_Seven.jpg" },
      { name: "Eight of Pentacles", path: "assets/minor/Pentacles_Eight.jpg" },
      { name: "Nine of Pentacles", path: "assets/minor/Pentacles_Nine.jpg" },
      { name: "Ten of Pentacles", path: "assets/minor/Pentacles_Ten.jpg" },
      { name: "Page of Pentacles", path: "assets/minor/Pentacles_Page.jpg" },
      { name: "Knight of Pentacles", path: "assets/minor/Pentacles_Knight.jpg" },
      { name: "Queen of Pentacles", path: "assets/minor/Pentacles_Queen.jpg" },
      { name: "King of Pentacles", path: "assets/minor/Pentacles_King.jpg" },

      // Minor Arcana - Swords (14)
      { name: "Ace of Swords", path: "assets/minor/Swords_Ace.jpg" },
      { name: "Two of Swords", path: "assets/minor/Swords_Two.jpg" },
      { name: "Three of Swords", path: "assets/minor/Swords_Three.jpg" },
      { name: "Four of Swords", path: "assets/minor/Swords_Four.jpg" },
      { name: "Five of Swords", path: "assets/minor/Swords_Five.jpg" },
      { name: "Six of Swords", path: "assets/minor/Swords_Six.jpg" },
      { name: "Seven of Swords", path: "assets/minor/Swords_Seven.jpg" },
      { name: "Eight of Swords", path: "assets/minor/Swords_Eight.jpg" },
      { name: "Nine of Swords", path: "assets/minor/Swords_Nine.jpg" },
      { name: "Ten of Swords", path: "assets/minor/Swords_Ten.jpg" },
      { name: "Page of Swords", path: "assets/minor/Swords_Page.jpg" },
      { name: "Knight of Swords", path: "assets/minor/Swords_Knight.jpg" },
      { name: "Queen of Swords", path: "assets/minor/Swords_Queen.jpg" },
      { name: "King of Swords", path: "assets/minor/Swords_King.jpg" },

      // Minor Arcana - Wands (14)
      { name: "Ace of Wands", path: "assets/minor/Wands_Ace.jpg" },
      { name: "Two of Wands", path: "assets/minor/Wands_Two.jpg" },
      { name: "Three of Wands", path: "assets/minor/Wands_Three.jpg" },
      { name: "Four of Wands", path: "assets/minor/Wands_Four.jpg" },
      { name: "Five of Wands", path: "assets/minor/Wands_Five.jpg" },
      { name: "Six of Wands", path: "assets/minor/Wands_Six.jpg" },
      { name: "Seven of Wands", path: "assets/minor/Wands_Seven.jpg" },
      { name: "Eight of Wands", path: "assets/minor/Wands_Eight.jpg" },
      { name: "Nine of Wands", path: "assets/minor/Wands_Nine.jpg" },
      { name: "Ten of Wands", path: "assets/minor/Wands_Ten.jpg" },
      { name: "Page of Wands", path: "assets/minor/Wands_Page.jpg" },
      { name: "Knight of Wands", path: "assets/minor/Wands_Knight.jpg" },
      { name: "Queen of Wands", path: "assets/minor/Wands_Queen.jpg" },
      { name: "King of Wands", path: "assets/minor/Wands_King.jpg" }
    ];

    function getShuffledDeck() {
      const shuffled = [...tarotDeck];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    // ฟังก์ชันเปิดไพ่ 1 และ 3 ใบ
    function drawCards(count) {
      const display = document.getElementById('cardsDisplay');
      display.className = 'cards-grid';
      display.innerHTML = '';

      const deck = getShuffledDeck();

      for (let i = 0; i < count; i++) {
        const card = deck[i];
        
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card-item';
        
        cardDiv.innerHTML = `
          <span class="card-title">CARD ${i + 1}</span>
          <div class="card-flip-container" id="cardContainer-${i}">
            <div class="card-face card-back">
              <img src="assets/back/Card_Back.jpg" alt="Card Back" onerror="handleImageError(this)">
            </div>
            <div class="card-face card-front">
              <img src="${card.path}" alt="${card.name}" onerror="handleImageError(this)">
            </div>
          </div>
          <p class="card-name-text">${card.name}</p>
        `;
        
        display.appendChild(cardDiv);

        setTimeout(() => {
          const containerElem = document.getElementById(`cardContainer-${i}`);
          if (containerElem) containerElem.classList.add('flipped');
        }, 150 + (i * 250));
      }
    }

    // ชื่อตำแหน่งของ Celtic Cross
    const celticPositions = [
      "1. Present", "2. Challenge", "3. Foundation",
      "4. Past", "5. Crown/Goal", "6. Future",
      "7. Self", "8. Environment", "9. Hopes/Fears", "10. Outcome"
    ];

    // ฟังก์ชันเปิดไพ่ 10 ใบ (Celtic Cross)
    function drawCelticCross() {
      const display = document.getElementById('cardsDisplay');
      display.className = 'celtic-cross-layout';
      display.innerHTML = `
        <div class="celtic-cross-circle" id="celticCircle"></div>
        <div class="celtic-cross-staff" id="celticStaff"></div>
      `;

      const circleElem = document.getElementById('celticCircle');
      const staffElem = document.getElementById('celticStaff');
      const deck = getShuffledDeck();

      for (let i = 0; i < 10; i++) {
        const card = deck[i];
        const posNum = i + 1;
        
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card-item';
        cardDiv.setAttribute('data-pos', posNum);
        
        cardDiv.innerHTML = `
          <span class="card-title">${celticPositions[i]}</span>
          <div class="card-flip-container" id="cardContainer-${i}">
            <div class="card-face card-back">
              <img src="assets/back/Card_Back.jpg" alt="Card Back" onerror="handleImageError(this)">
            </div>
            <div class="card-face card-front">
              <img src="${card.path}" alt="${card.name}" onerror="handleImageError(this)">
            </div>
          </div>
          <p class="card-name-text">${card.name}</p>
        `;

        if (posNum <= 6) {
          circleElem.appendChild(cardDiv);
        } else {
          staffElem.appendChild(cardDiv);
        }

        setTimeout(() => {
          const containerElem = document.getElementById(`cardContainer-${i}`);
          if (containerElem) containerElem.classList.add('flipped');
        }, 200 + (i * 200));
      }
    }

    function handleImageError(img) {
      if (!img.dataset.tryCount) img.dataset.tryCount = "1";
      const count = parseInt(img.dataset.tryCount);
      const src = img.src;

      if (count === 1) {
        img.dataset.tryCount = "2";
        img.src = src.replace(/\.jpg$/i, '.PNG');
      } else if (count === 2) {
        img.dataset.tryCount = "3";
        img.src = src.replace(/\.PNG$/, '.png');
      } else if (count === 3) {
        img.dataset.tryCount = "4";
        img.src = src.replace(/\.png$/, '.jpeg');
      }
    }

    function resetDeck() {
      document.getElementById('cardsDisplay').innerHTML = '';
    }
  </script>
</body>
</html>
