<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial Gate Tarot</title>
  <style>
    :root {
      --bg-color: #0b0712;
      --card-bg: rgba(255, 255, 255, 0.05);
      --text-main: #f3e8ff;
      --text-sub: #c0a9d4;
      --accent: #d8b4fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cinzel', 'Georgia', serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      background-image: radial-gradient(circle at 50% 0%, #2e1065 0%, var(--bg-color) 70%);
      overflow-x: hidden;
    }

    /* --- INTRO SCREEN --- */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 40%, #2e1065 0%, #0b0712 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 1.2s ease, transform 1.2s ease, visibility 1.2s;
    }

    #intro-screen.hidden {
      opacity: 0;
      transform: scale(1.15);
      visibility: hidden;
    }

    .portal-card-wrapper {
      width: 220px;
      height: 380px;
      border-radius: 16px;
      border: 1px solid rgba(216, 180, 254, 0.4);
      overflow: hidden;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
      cursor: pointer;
      animation: floatGlow 4s ease-in-out infinite;
    }

    .portal-card-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    @keyframes floatGlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .enter-btn {
      margin-top: 2rem;
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      color: white;
      border: none;
      padding: 0.85rem 2.2rem;
      border-radius: 30px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* --- MAIN APP SECTION --- */
    header { text-align: center; margin-bottom: 1rem; }
    h1 { font-size: 2.2rem; color: var(--accent); }
    p.subtitle { color: var(--text-sub); font-size: 0.95rem; font-style: italic; }

    .container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      opacity: 0;
      transition: opacity 1.5s ease 0.5s;
    }

    .container.visible { opacity: 1; }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    button.action-btn, button.shuffle-btn {
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      color: white;
      border: none;
      padding: 0.75rem 1.4rem;
      border-radius: 25px;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    button.shuffle-btn {
      background: linear-gradient(135deg, #e879f9, #a855f7);
    }

    button.reset-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 0.75rem 1.4rem;
      border-radius: 25px;
      cursor: pointer;
    }

    .instruction-text {
      font-size: 1.1rem;
      color: var(--accent);
      text-align: center;
      min-height: 1.5rem;
      margin: 0.5rem 0;
    }

    /* --- FAN DECK (กางไพ่เรียงแถว) --- */
    .fan-deck-container {
      width: 100%;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 1rem 0;
      overflow-x: auto;
      padding: 10px 0;
    }

    .fan-card {
      width: 90px;
      height: 155px;
      position: absolute;
      border-radius: 6px;
      border: 1px solid rgba(216, 180, 254, 0.4);
      box-shadow: -2px 0 8px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.3s ease, margin-top 0.3s ease;
    }

    .fan-card:hover {
      transform: translateY(-20px) scale(1.08) !important;
      z-index: 100 !important;
      box-shadow: 0 10px 20px rgba(216, 180, 254, 0.5);
    }

    .fan-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 5px;
    }

    .fan-card.selected {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50px) scale(0.5) !important;
    }

    /* --- STANDARD GRID & CELTIC CROSS LAYOUT --- */
    .cards-grid {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      width: 100%;
      margin-top: 1rem;
      min-height: 380px;
    }

    .card-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      perspective: 1000px;
    }

    .card-title {
      font-size: 0.8rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .celtic-cross-layout {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4rem;
      width: 100%;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .celtic-cross-circle {
      position: relative;
      width: 480px;
      height: 620px;
    }

    .celtic-cross-circle .card-item[data-pos="1"] {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1;
    }
    .celtic-cross-circle .card-item[data-pos="2"] {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(90deg); z-index: 2;
    }
    .celtic-cross-circle .card-item[data-pos="3"] { position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
    .celtic-cross-circle .card-item[data-pos="4"] { position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
    .celtic-cross-circle .card-item[data-pos="5"] { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
    .celtic-cross-circle .card-item[data-pos="6"] { position: absolute; left: 0; top: 50%; transform: translateY(-50%); }

    .celtic-cross-staff { display: flex; flex-direction: column-reverse; gap: 1rem; }

    /* --- 3D FLIP --- */
    .card-flip-container {
      width: 125px;
      height: 215px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
    }

    .cards-grid .card-flip-container { width: 200px; height: 345px; }
    .card-flip-container.flipped { transform: rotateY(180deg); }
    .celtic-cross-circle .card-item[data-pos="2"] .card-flip-container.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 8px;
      border: 1px solid rgba(216, 180, 254, 0.25);
      overflow: hidden; background-color: var(--card-bg);
    }

    .card-face img { width: 100%; height: 100%; object-fit: cover; }
    .card-back { transform: rotateY(0deg); }
    .card-front { transform: rotateY(180deg); }
    .card-name-text { font-size: 0.85rem; max-width: 130px; text-align: center; }
  </style>
</head>
<body>

  <!-- INTRO SCREEN -->
  <div id="intro-screen">
    <p style="font-size: 0.85rem; color: var(--accent); letter-spacing: 4px; margin-bottom: 0.8rem;">CELESTIAL GATE TAROT</p>
    <div class="portal-card-wrapper" onclick="enterGate()">
      <img src="assets/major/00_Celestial_Gate.jpg" alt="Celestial Gate Entrance" onerror="handleImageError(this)">
    </div>
    <button class="enter-btn" onclick="enterGate()">ENTER THE GATE</button>
  </div>

  <!-- MAIN APP -->
  <header>
    <p style="font-size: 0.8rem; color: var(--accent); letter-spacing: 3px;">CELESTIAL GATE TAROT</p>
    <h1>Celestial Oracle</h1>
    <p class="subtitle">Focus your mind, pick your cards, and reveal your path.</p>
  </header>

  <div class="container" id="mainContainer">
    <div class="controls">
      <button class="shuffle-btn" onclick="prepareMode('shuffle')">🂠 สับไพ่ (Shuffle)</button>
      <button class="action-btn" onclick="prepareMode(1)">เลือก 1 ใบ</button>
      <button class="action-btn" onclick="prepareMode(3)">เลือก 3 ใบ</button>
      <button class="action-btn" onclick="prepareMode(10)">เลือก 10 ใบ (Celtic Cross)</button>
      <button class="reset-btn" onclick="resetDeck()">รีเซ็ต</button>
    </div>

    <!-- ข้อความแนะนำผู้ใช้ -->
    <div class="instruction-text" id="instruction">กรุณากดเลือกรูปแบบการดูไพ่ หรือกดสับไพ่ก่อนครับ</div>

    <!-- กองไพ่ที่กางให้หยิบ -->
    <div class="fan-deck-container" id="fanDeckContainer"></div>

    <!-- กระดานแสดงไพ่ที่เลือก -->
    <div id="cardsDisplay"></div>
  </div>

  <script>
    let activeDeck = [];
    let selectedCards = [];
    let targetCount = 0;
    let currentMode = '';

    function enterGate() {
      document.getElementById('intro-screen').classList.add('hidden');
      document.getElementById('mainContainer').classList.add('visible');
      resetDeck();
    }

    const tarotDeck = [

      { name: "Strength", path: "assets/major/09_Strength.jpg" },
      { name: "The Hermit", path: "assets/major/10_The_Hermit.jpg" },
      { name: "Wheel of Fortune", path: "assets/major/11_Wheel_of_Fortune.jpg" },
      { name: "Justice", path: "assets/major/12_Justice.jpg" },

      { name: "The Devil", path: "assets/major/16_The_Devil.jpg" },
      { name: "The Tower", path: "assets/major/17_The_Tower.jpg" },
      { name: "The Star", path: "assets/major/18_The_Star.jpg" },
      { name: "The Moon", path: "assets/major/19_The_Moon.jpg" },
      { name: "The Sun", path: "assets/major/20_The_Sun.jpg" },
      { name: "Judgement", path: "assets/major/21_Judgement.jpg" },
      { name: "The World", path: "assets/major/22_The_World.jpg" },

      { name: "Ace of Cups", path: "assets/minor/Cups_Ace.jpg" },
      { name: "Two of Cups", path: "assets/minor/Cups_Two.jpg" },

      { name: "Nine of Cups", path: "assets/minor/Cups_Nine.jpg" },

      { name: "King of Cups", path: "assets/minor/Cups_King.jpg" },

      { name: "Ace of Pentacles", path: "assets/minor/Pentacles_Ace.jpg" },
      { name: "Two of Pentacles", path: "assets/minor/Pentacles_Two.jpg" },
      { name: "Three of Pentacles", path: "assets/minor/Pentacles_Three.jpg" },
      { name: "Four of Pentacles", path: "assets/minor/Pentacles_Four.jpg" },

      { name: "Six of Pentacles", path: "assets/minor/Pentacles_Six.jpg" },
      { name: "Seven of Pentacles", path: "assets/minor/Pentacles_Seven.jpg" },
      { name: "Eight of Pentacles", path: "assets/minor/Pentacles_Eight.jpg" },
      { name: "Nine of Pentacles", path: "assets/minor/Pentacles_Nine.jpg" },
      { name: "Ten of Pentacles", path: "assets/minor/Pentacles_Ten.jpg" },
      { name: "Page of Pentacles", path: "assets/minor/Pentacles_Page.jpg" },
      { name: "Knight of Pentacles", path: "assets/minor/Pentacles_Knight.jpg" },
      { name: "Queen of Pentacles", path: "assets/minor/Pentacles_Queen.jpg" },
      { name: "King of Pentacles", path: "assets/minor/Pentacles_King.jpg" },

      { name: "Ace of Swords", path: "assets/minor/Swords_Ace.jpg" },
      { name: "Two of Swords", path: "assets/minor/Swords_Two.jpg" },
      { name: "Three of Swords", path: "assets/minor/Swords_Three.jpg" },
      { name: "Four of Swords", path: "assets/minor/Swords_Four.jpg" },

      { name: "Eight of Swords", path: "assets/minor/Swords_Eight.jpg" },
      { name: "Nine of Swords", path: "assets/minor/Swords_Nine.jpg" },
      { name: "Ten of Swords", path: "assets/minor/Swords_Ten.jpg" },
      { name: "Page of Swords", path: "assets/minor/Swords_Page.jpg" },
      { name: "Knight of Swords", path: "assets/minor/Swords_Knight.jpg" },
      { name: "Queen of Swords", path: "assets/minor/Swords_Queen.jpg" },
      { name: "King of Swords", path: "assets/minor/Swords_King.jpg" },

      { name: "Ace of Wands", path: "assets/minor/Wands_Ace.jpg" },
      { name: "Two of Wands", path: "assets/minor/Wands_Two.jpg" },
      { name: "Three of Wands", path: "assets/minor/Wands_Three.jpg" },
      { name: "Four of Wands", path: "assets/minor/Wands_Four.jpg" },
      { name: "Five of Wands", path: "assets/minor/Wands_Five.jpg" },
      { name: "Six of Wands", path: "assets/minor/Wands_Six.jpg" },
      { name: "Seven of Wands", path: "assets/minor/Wands_Seven.jpg" },
      { name: "Eight of Wands", path: "assets/minor/Wands_Eight.jpg" },
      { name: "Nine of Wands", path: "assets/minor/Wands_Nine.jpg" },
      { name: "Ten of Wands", path: "assets/minor/Wands_Ten.jpg" },
      { name: "Page of Wands", path: "assets/minor/Wands_Page.jpg" },
      { name: "Knight of Wands", path: "assets/minor/Wands_Knight.jpg" },
      { name: "Queen of Wands", path: "assets/minor/Wands_Queen.jpg" },
      { name: "King of Wands", path: "assets/minor/Wands_King.jpg" }
    ];

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function renderFanDeck() {
      const container = document.getElementById('fanDeckContainer');
      container.innerHTML = '';
      
      const totalCards = activeDeck.length;
      const spreadWidth = Math.min(window.innerWidth - 40, 950);
      const step = spreadWidth / totalCards;
      const startLeft = (container.clientWidth - spreadWidth) / 2;

      activeDeck.forEach((card, index) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'fan-card';
        cardDiv.id = `fan-card-${index}`;
        
        const leftPos = (index * step);
        const rotateDeg = ((index - totalCards / 2) * 0.35);
        
        cardDiv.style.left = `${leftPos}px`;
        cardDiv.style.transform = `rotate(${rotateDeg}deg)`;
        cardDiv.style.zIndex = index;
        
        cardDiv.innerHTML = `<img src="assets/back/Card_Back.jpg" alt="Card Back" onerror="handleImageError(this)">`;
        
        cardDiv.onclick = () => selectCard(index, cardDiv);
        container.appendChild(cardDiv);
      });
    }

    function prepareMode(mode) {
      document.getElementById('cardsDisplay').innerHTML = '';
      selectedCards = [];

      if (mode === 'shuffle') {
        activeDeck = shuffleArray(tarotDeck);
        renderFanDeck();
        document.getElementById('instruction').innerText = "สับไพ่เรียบร้อยแล้ว กรุณากดเลือกจำนวนไพ่ที่ต้องการดูครับ";
        return;
      }

      if (activeDeck.length === 0) {
        activeDeck = shuffleArray(tarotDeck);
        renderFanDeck();
      }

      targetCount = mode;
      currentMode = mode;
      document.getElementById('instruction').innerText = `กรุณาแตะเลือกไพ่จากกองด้านบนให้ครบ ${targetCount} ใบ (เลือกแล้ว 0/${targetCount})`;
    }

    function selectCard(index, cardElem) {
      if (targetCount === 0) {
        alert("กรุณากดเลือกจำนวนไพ่ที่ต้องการดูก่อนครับ (1 ใบ, 3 ใบ หรือ Celtic Cross)");
        return;
      }

      if (cardElem.classList.contains('selected')) return;

      cardElem.classList.add('selected');
      selectedCards.push(activeDeck[index]);

      document.getElementById('instruction').innerText = `เลือกแล้ว ${selectedCards.length}/${targetCount} ใบ`;

      if (selectedCards.length === targetCount) {
        document.getElementById('instruction').innerText = "กำลังจัดวางไพ่ของคุณ...";
        setTimeout(() => {
          if (targetCount === 10) {
            displayCelticCross();
          } else {
            displayStandardGrid();
          }
          document.getElementById('instruction').innerText = "กางไพ่เรียบร้อยแล้ว";
          targetCount = 0; // Reset
        }, 500);
      }
    }

    function displayStandardGrid() {
      const display = document.getElementById('cardsDisplay');
      display.className = 'cards-grid';
      display.innerHTML = '';

      selectedCards.forEach((card, i) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card-item';
        
        cardDiv.innerHTML = `
          <span class="card-title">CARD ${i + 1}</span>
          <div class="card-flip-container" id="cardContainer-${i}">
            <div class="card-face card-back">
              <img src="assets/back/Card_Back.jpg" alt="Card Back" onerror="handleImageError(this)">
            </div>
            <div class="card-face card-front">
              <img src="${card.path}" alt="${card.name}" onerror="handleImageError(this)">
            </div>
          </div>
          <p class="card-name-text">${card.name}</p>
        `;
        
        display.appendChild(cardDiv);

        setTimeout(() => {
          const containerElem = document.getElementById(`cardContainer-${i}`);
          if (containerElem) containerElem.classList.add('flipped');
        }, 200 + (i * 250));
      });
    }

    const celticPositions = [
      "1. Present", "2. Challenge", "3. Crown / Goal", 
      "4. Future", "5. Foundation", "6. Past",
      "7. Self", "8. Environment", "9. Hopes / Fears", "10. Outcome"
    ];

    function displayCelticCross() {
      const display = document.getElementById('cardsDisplay');
      display.className = 'celtic-cross-layout';
      display.innerHTML = `
        <div class="celtic-cross-circle" id="celticCircle"></div>
        <div class="celtic-cross-staff" id="celticStaff"></div>
      `;

      const circleElem = document.getElementById('celticCircle');
      const staffElem = document.getElementById('celticStaff');

      selectedCards.forEach((card, i) => {
        const posNum = i + 1;
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card-item';
        cardDiv.setAttribute('data-pos', posNum);
        
        cardDiv.innerHTML = `
          <span class="card-title">${celticPositions[i]}</span>
          <div class="card-flip-container" id="cardContainer-${i}">
            <div class="card-face card-back">
              <img src="assets/back/Card_Back.jpg" alt="Card Back" onerror="handleImageError(this)">
            </div>
            <div class="card-face card-front">
              <img src="${card.path}" alt="${card.name}" onerror="handleImageError(this)">
            </div>
          </div>
          <p class="card-name-text">${card.name}</p>
        `;

        if (posNum <= 6) {
          circleElem.appendChild(cardDiv);
        } else {
          staffElem.appendChild(cardDiv);
        }

        setTimeout(() => {
          const containerElem = document.getElementById(`cardContainer-${i}`);
          if (containerElem) containerElem.classList.add('flipped');
        }, 250 + (i * 200));
      });
    }

    function handleImageError(img) {
      if (!img.dataset.tryCount) img.dataset.tryCount = "1";
      const count = parseInt(img.dataset.tryCount);
      const src = img.src;

      if (count === 1) {
        img.dataset.tryCount = "2";
        img.src = src.replace(/\.jpg$/i, '.PNG');
      } else if (count === 2) {
        img.dataset.tryCount = "3";
        img.src = src.replace(/\.PNG$/, '.png');
      } else if (count === 3) {
        img.dataset.tryCount = "4";
        img.src = src.replace(/\.png$/, '.jpeg');
      }
    }

    function resetDeck() {
      document.getElementById('cardsDisplay').innerHTML = '';
      selectedCards = [];
      targetCount = 0;
      activeDeck = shuffleArray(tarotDeck);
      renderFanDeck();
      document.getElementById('instruction').innerText = "กรุณากดเลือกรูปแบบการดูไพ่ หรือกดสับไพ่ก่อนครับ";
    }
  </script>
</body>
</html>
