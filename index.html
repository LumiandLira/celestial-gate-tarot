<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celestial Gate Tarot</title>
  <style>
    :root {
      --bg-color: #0d0e15;
      --card-bg: #161824;
      --accent-color: #d4af37;
      --text-color: #e2e8f0;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      color: var(--accent-color);
      font-size: 2.2rem;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: linear-gradient(135deg, #1e2235, #2a2f4c);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    button:hover {
      background: var(--accent-color);
      color: var(--bg-color);
      box-shadow: 0 0 15px var(--accent-color);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .shuffling-status {
      color: var(--accent-color);
      font-size: 1.2rem;
      margin: 20px 0;
      letter-spacing: 1px;
      display: none;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .card-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 1200px;
      width: 100%;
      margin-bottom: 30px;
    }

    .card-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 180px;
    }

    .card-wrapper {
      width: 180px;
      height: 310px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--accent-color);
      background-color: var(--card-bg);
    }

    .card-back {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-back img, .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-front {
      transform: rotateY(180deg);
      background-color: #000;
    }

    .card-label {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--accent-color);
      text-align: center;
      font-weight: bold;
    }

    .clarifier-section {
      width: 100%;
      max-width: 1200px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px dashed rgba(212, 175, 55, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .clarifier-title {
      color: var(--accent-color);
      font-size: 1.1rem;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .clarifier-btn-wrapper {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Celestial Gate Tarot</h1>
    <p style="color: var(--text-dim);">ตั้งจิตอธิษฐานแล้วเลือกรูปแบบการทำนาย</p>
  </header>

  <div class="controls">
    <button onclick="startDrawing(1)">เปิดไพ่ 1 ใบ</button>
    <button onclick="startDrawing(3)">เปิดไพ่ 3 ใบ</button>
    <button onclick="startDrawing(5)">เปิดไพ่ 5 ใบ</button>
  </div>

  <div class="shuffling-status" id="shuffling-status">🔮 กำลังสับสำรับไพ่...</div>

  <!-- โซนไพ่หลัก -->
  <div class="card-container" id="main-cards-container"></div>

  <!-- โซนไพ่ขยาย (Clarifier Cards) -->
  <div class="clarifier-section" id="clarifier-section" style="display: none;">
    <div class="clarifier-btn-wrapper">
      <button id="add-clarifier-btn" onclick="drawClarifierCard()">+ เปิดไพ่ขยาย ( Clarifier Card )</button>
    </div>
    <div class="clarifier-title" id="clarifier-title" style="display: none;">✨ ไพ่ขยายความหมายเพิ่มเติม</div>
    <div class="card-container" id="clarifier-cards-container"></div>
  </div>

  <script>
    const deckData = [
      // Major Arcana (22)
      { name: "The Fool", file: "assets/major/00_Fool.jpg" },
      { name: "The Magician", file: "assets/major/01_Magician.jpg" },
      { name: "The High Priestess", file: "assets/major/02_HighPriestess.jpg" },
      { name: "The Empress", file: "assets/major/03_Empress.jpg" },
      { name: "The Emperor", file: "assets/major/04_Emperor.jpg" },
      { name: "The Hierophant", file: "assets/major/05_Hierophant.jpg" },
      { name: "The Lovers", file: "assets/major/06_Lovers.jpg" },
      { name: "The Chariot", file: "assets/major/07_Chariot.jpg" },
      { name: "Strength", file: "assets/major/08_Strength.jpg" },
      { name: "The Hermit", file: "assets/major/09_Hermit.jpg" },
      { name: "Wheel of Fortune", file: "assets/major/10_WheelOfFortune.jpg" },
      { name: "Justice", file: "assets/major/11_Justice.jpg" },
      { name: "The Hanged Man", file: "assets/major/12_HangedMan.jpg" },
      { name: "Death", file: "assets/major/13_Death.jpg" },
      { name: "Temperance", file: "assets/major/14_Temperance.jpg" },
      { name: "The Devil", file: "assets/major/15_Devil.jpg" },
      { name: "The Tower", file: "assets/major/16_Tower.jpg" },
      { name: "The Star", file: "assets/major/17_Star.jpg" },
      { name: "The Moon", file: "assets/major/18_Moon.jpg" },
      { name: "The Sun", file: "assets/major/19_Sun.jpg" },
      { name: "Judgement", file: "assets/major/20_Judgement.jpg" },
      { name: "The World", file: "assets/major/21_World.jpg" },

      // Minor Arcana - Swords
      { name: "Ace of Swords", file: "assets/minor/Swords_Ace.jpg" },
      { name: "Two of Swords", file: "assets/minor/Swords_Two.jpg" },
      { name: "Three of Swords", file: "assets/minor/Swords_Three.jpg" },
      { name: "Four of Swords", file: "assets/minor/Swords_Four.jpg" },
      { name: "Five of Swords", file: "assets/minor/Swords_Five.jpg" },
      { name: "Six of Swords", file: "assets/minor/Swords_Six.jpg" },
      { name: "Seven of Swords", file: "assets/minor/Swords_Seven.jpg" },
      { name: "Eight of Swords", file: "assets/minor/Swords_Eight.jpg" },
      { name: "Nine of Swords", file: "assets/minor/Swords_Nine.jpg" },
      { name: "Ten of Swords", file: "assets/minor/Swords_Ten.jpg" },
      { name: "Page of Swords", file: "assets/minor/Swords_Page.jpg" },
      { name: "Knight of Swords", file: "assets/minor/Swords_Knight.jpg" },
      { name: "Queen of Swords", file: "assets/minor/Swords_Queen.jpg" },
      { name: "King of Swords", file: "assets/minor/Swords_King.jpg" },

      // Minor Arcana - Cups
      { name: "Ace of Cups", file: "assets/minor/Cups_Ace.jpg" },
      { name: "Two of Cups", file: "assets/minor/Cups_Two.jpg" },
      { name: "Three of Cups", file: "assets/minor/Cups_Three.jpg" },
      { name: "Four of Cups", file: "assets/minor/Cups_Four.jpg" },
      { name: "Five of Cups", file: "assets/minor/Cups_Five.jpg" },
      { name: "Six of Cups", file: "assets/minor/Cups_Six.jpg" },
      { name: "Seven of Cups", file: "assets/minor/Cups_Seven.jpg" },
      { name: "Eight of Cups", file: "assets/minor/Cups_Eight.jpg" },
      { name: "Nine of Cups", file: "assets/minor/Cups_Nine.jpg" },
      { name: "Ten of Cups", file: "assets/minor/Cups_Ten.jpg" },
      { name: "Page of Cups", file: "assets/minor/Cups_Page.jpg" },
      { name: "Knight of Cups", file: "assets/minor/Cups_Knight.jpg" },
      { name: "Queen of Cups", file: "assets/minor/Cups_Queen.jpg" },
      { name: "King of Cups", file: "assets/minor/Cups_King.jpg" },

      // Minor Arcana - Wands
      { name: "Ace of Wands", file: "assets/minor/Wands_Ace.jpg" },
      { name: "Two of Wands", file: "assets/minor/Wands_Two.jpg" },
      { name: "Three of Wands", file: "assets/minor/Wands_Three.jpg" },
      { name: "Four of Wands", file: "assets/minor/Wands_Four.jpg" },
      { name: "Five of Wands", file: "assets/minor/Wands_Five.jpg" },
      { name: "Six of Wands", file: "assets/minor/Wands_Six.jpg" },
      { name: "Seven of Wands", file: "assets/minor/Wands_Seven.jpg" },
      { name: "Eight of Wands", file: "assets/minor/Wands_Eight.jpg" },
      { name: "Nine of Wands", file: "assets/minor/Wands_Nine.jpg" },
      { name: "Ten of Wands", file: "assets/minor/Wands_Ten.jpg" },
      { name: "Page of Wands", file: "assets/minor/Wands_Page.jpg" },
      { name: "Knight of Wands", file: "assets/minor/Wands_Knight.jpg" },
      { name: "Queen of Wands", file: "assets/minor/Wands_Queen.jpg" },
      { name: "King of Wands", file: "assets/minor/Wands_King.jpg" },

      // Minor Arcana - Pentacles
      { name: "Ace of Pentacles", file: "assets/minor/Pentacles_Ace.jpg" },
      { name: "Two of Pentacles", file: "assets/minor/Pentacles_Two.jpg" },
      { name: "Three of Pentacles", file: "assets/minor/Pentacles_Three.jpg" },
      { name: "Four of Pentacles", file: "assets/minor/Pentacles_Four.jpg" },
      { name: "Five of Pentacles", file: "assets/minor/Pentacles_Five.jpg" },
      { name: "Six of Pentacles", file: "assets/minor/Pentacles_Six.jpg" },
      { name: "Seven of Pentacles", file: "assets/minor/Pentacles_Seven.jpg" },
      { name: "Eight of Pentacles", file: "assets/minor/Pentacles_Eight.jpg" },
      { name: "Nine of Pentacles", file: "assets/minor/Pentacles_Nine.jpg" },
      { name: "Ten of Pentacles", file: "assets/minor/Pentacles_Ten.jpg" },
      { name: "Page of Pentacles", file: "assets/minor/Pentacles_Page.jpg" },
      { name: "Knight of Pentacles", file: "assets/minor/Pentacles_Knight.jpg" },
      { name: "Queen of Pentacles", file: "assets/minor/Pentacles_Queen.jpg" },
      { name: "King of Pentacles", file: "assets/minor/Pentacles_King.jpg" }
    ];

    let remainingDeck = [];
    let clarifierCount = 0;

    function handleImageError(imgElement, originalPath) {
      if (imgElement.dataset.tried) return;
      imgElement.dataset.tried = "true";

      if (originalPath.includes('card_back') || originalPath.includes('card-back')) {
        imgElement.src = originalPath.includes('card_back.jpg') ? 'assets/back/card-back.jpg' : 'assets/back/card_back.jpg';
        return;
      }

      if (originalPath.endsWith('.jpg')) {
        imgElement.src = originalPath.replace('.jpg', '.png');
      } else if (originalPath.endsWith('.png')) {
        imgElement.src = originalPath.replace('.png', '.jpg');
      }
    }

    function shuffleDeck() {
      remainingDeck = [...deckData];
      for (let i = remainingDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [remainingDeck[i], remainingDeck[j]] = [remainingDeck[j], remainingDeck[i]];
      }
    }

    function startDrawing(count) {
      const status = document.getElementById('shuffling-status');
      const mainContainer = document.getElementById('main-cards-container');
      const clarifierSection = document.getElementById('clarifier-section');
      
      mainContainer.innerHTML = '';
      clarifierSection.style.display = 'none';
      status.style.display = 'block';

      setTimeout(() => {
        status.style.display = 'none';
        drawCards(count);
      }, 500);
    }

    function drawCards(count) {
      shuffleDeck();
      clarifierCount = 0;

      const mainContainer = document.getElementById('main-cards-container');
      const clarifierSection = document.getElementById('clarifier-section');
      const clarifierContainer = document.getElementById('clarifier-cards-container');
      const clarifierTitle = document.getElementById('clarifier-title');
      const addClarifierBtn = document.getElementById('add-clarifier-btn');

      mainContainer.innerHTML = '';
      clarifierContainer.innerHTML = '';
      clarifierTitle.style.display = 'none';
      addClarifierBtn.disabled = false;
      addClarifierBtn.innerText = "+ เปิดไพ่ขยาย ( Clarifier Card )";

      for (let i = 0; i < count; i++) {
        const cardData = remainingDeck.pop();
        
        let labelText = `ใบที่ ${i + 1}`;
        if (count === 3) {
          const labels3 = ["อดีต / จุดเริ่มต้น", "ปัจจุบัน / สถานการณ์", "อนาคต / บทสรุป"];
          labelText = labels3[i];
        } else if (count === 5) {
          const labels5 = ["สถานการณ์ปัจจุบัน", "อุปสรรค / สิ่งที่พบ", "อดีต / ฐานของเรื่อง", "อนาคตอันใกล้", "บทสรุป"];
          labelText = labels5[i];
        }

        const slot = document.createElement('div');
        slot.className = 'card-slot';
        slot.innerHTML = `
          <div class="card-wrapper" onclick="this.querySelector('.card').classList.toggle('flipped')">
            <div class="card">
              <div class="card-face card-back">
                <img src="assets/back/card_back.jpg" onerror="handleImageError(this, 'assets/back/card_back.jpg')" alt="หลังไพ่">
              </div>
              <div class="card-face card-front">
                <img src="${cardData.file}" onerror="handleImageError(this, '${cardData.file}')" alt="${cardData.name}">
              </div>
            </div>
          </div>
          <div class="card-label">${labelText}</div>
        `;
        mainContainer.appendChild(slot);
      }

      clarifierSection.style.display = 'flex';
    }

    function drawClarifierCard() {
      if (remainingDeck.length === 0 || clarifierCount >= 3) return;

      clarifierCount++;
      const cardData = remainingDeck.pop();
      const clarifierContainer = document.getElementById('clarifier-cards-container');
      const clarifierTitle = document.getElementById('clarifier-title');
      const addClarifierBtn = document.getElementById('add-clarifier-btn');

      clarifierTitle.style.display = 'block';

      const slot = document.createElement('div');
      slot.className = 'card-slot';
      slot.innerHTML = `
        <div class="card-wrapper" onclick="this.querySelector('.card').classList.toggle('flipped')">
          <div class="card">
            <div class="card-face card-back">
              <img src="assets/back/card_back.jpg" onerror="handleImageError(this, 'assets/back/card_back.jpg')" alt="หลังไพ่">
            </div>
            <div class="card-face card-front">
              <img src="${cardData.file}" onerror="handleImageError(this, '${cardData.file}')" alt="${cardData.name}">
            </div>
          </div>
        </div>
        <div class="card-label">ไพ่ขยายที่ ${clarifierCount}</div>
      `;

      clarifierContainer.appendChild(slot);

      if (clarifierCount >= 3) {
        addClarifierBtn.disabled = true;
        addClarifierBtn.innerText = "เปิดไพ่ขยายครบแล้ว (สูงสุด 3 ใบ)";
      }
    }

    // เมื่อเปิดหน้าเว็บมา ให้โหลดไพ่ 3 ใบขึ้นทันทีอัตโนมัติ
    window.onload = function() {
      drawCards(3);
    };
  </script>
</body>
</html>
