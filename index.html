<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial Gate Tarot</title>
  <style>
    :root {
      --bg-color: #0b0712;
      --card-bg: rgba(255, 255, 255, 0.05);
      --text-main: #f3e8ff;
      --text-sub: #c0a9d4;
      --accent: #d8b4fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cinzel', 'Georgia', serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: radial-gradient(circle at 50% 0%, #2e1065 0%, var(--bg-color) 70%);
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(216, 180, 254, 0.4);
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 0.95rem;
      font-style: italic;
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .gate-section {
      text-align: center;
      width: 100%;
    }

    .card-slot {
      width: 220px;
      height: 380px;
      margin: 1rem auto;
      border-radius: 12px;
      border: 1px solid rgba(216, 180, 254, 0.2);
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      background-color: var(--card-bg);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    button {
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
    }

    button.reset-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    button.reset-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .cards-grid {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      width: 100%;
      margin-top: 1rem;
    }

    .card-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .card-title {
      font-size: 0.9rem;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <p style="font-size: 0.8rem; color: var(--accent); letter-spacing: 3px;">CELESTIAL GATE TAROT</p>
    <h1>Open the Gate</h1>
    <p class="subtitle">Enter quietly. Let the card find you.</p>
  </header>

  <div class="container">
    <div class="gate-section">
      <div class="card-slot">
        <!-- ปรับเป็น Card_Back.jpg ตามชื่อไฟล์บน GitHub -->
        <img src="assets/back/Card_Back.jpg" alt="Celestial Gate Opening Card" id="gateImg">
      </div>

      <div class="controls">
        <button onclick="drawCards(1)">Open 1 Card</button>
        <button onclick="drawCards(3)">Open 3 Cards</button>
        <button class="reset-btn" onclick="resetDeck()">Reset</button>
      </div>
      <p style="font-size: 0.85rem; color: var(--text-sub); margin-top: 1rem;">The Gate is open. Take a moment with the cards.</p>
    </div>

    <div class="cards-grid" id="cardsDisplay"></div>
  </div>

  <script>
    // รายชื่อไพ่ Major Arcana ตรงกับไฟล์ .jpg บน GitHub
    const majorArcana = [
      { name: "Celestial Gate", file: "00_Celestial_Gate.jpg" },
      { name: "The Fool", file: "01_The_Fool.jpg" },
      { name: "The Magician", file: "02_The_Magician.jpg" },
      { name: "The High Priestess", file: "03_The_High_Priestess.jpg" },
      { name: "The Empress", file: "04_The_Empress.jpg" },
      { name: "The Emperor", file: "05_The_Emperor.jpg" },
      { name: "The Hierophant", file: "06_The_Hierophant.jpg" },
      { name: "The Lovers", file: "07_The_Lovers.jpg" },
      { name: "The Chariot", file: "08_The_Chariot.jpg" },
      { name: "Strength", file: "09_Strength.jpg" },
      { name: "The Hermit", file: "10_The_Hermit.jpg" },
      { name: "Wheel of Fortune", file: "11_Wheel_of_Fortune.jpg" },
      { name: "Justice", file: "12_Justice.jpg" },
      { name: "The Hanged Man", file: "13_The_Hanged_Man.jpg" },
      { name: "Death", file: "14_Death.jpg" },
      { name: "Temperance", file: "15_Temperance.jpg" },
      { name: "The Devil", file: "16_The_Devil.jpg" },
      { name: "The Tower", file: "17_The_Tower.jpg" },
      { name: "The Star", file: "18_The_Star.jpg" },
      { name: "The Moon", file: "19_The_Moon.jpg" },
      { name: "The Sun", file: "20_The_Sun.jpg" },
      { name: "Judgement", file: "21_Judgement.jpg" },
      { name: "The World", file: "22_The_World.jpg" }
    ];

    function getRandomCard() {
      const randomIndex = Math.floor(Math.random() * majorArcana.length);
      return majorArcana[randomIndex];
    }

    function drawCards(count) {
      const display = document.getElementById('cardsDisplay');
      display.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const card = getRandomCard();
        
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card-item';
        
        cardDiv.innerHTML = `
          <span class="card-title">CARD ${i + 1}</span>
          <div class="card-slot">
            <img src="assets/major/${card.file}" alt="${card.name}">
          </div>
          <p style="margin-top: 0.5rem; font-size: 1rem;">${card.name}</p>
        `;
        
        display.appendChild(cardDiv);
      }
    }

    function resetDeck() {
      document.getElementById('cardsDisplay').innerHTML = '';
      document.getElementById('gateImg').src = 'assets/back/Card_Back.jpg';
    }
  </script>
</body>
</html>
