  <style>
    :root {
      --bg-color: #0b0712;
      --card-bg: rgba(255, 255, 255, 0.05);
      --text-main: #f3e8ff;
      --text-sub: #c0a9d4;
      --accent: #d8b4fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cinzel', 'Georgia', serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      background-image: radial-gradient(circle at 50% 0%, #2e1065 0%, var(--bg-color) 70%);
      overflow-x: hidden;
    }

    /* --- INTRO SCREEN --- */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 40%, #2e1065 0%, #0b0712 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 1.2s ease, transform 1.2s ease, visibility 1.2s;
    }

    #intro-screen.hidden {
      opacity: 0;
      transform: scale(1.15);
      visibility: hidden;
    }

    .portal-card-wrapper {
      width: 220px;
      height: 380px;
      border-radius: 16px;
      border: 1px solid rgba(216, 180, 254, 0.4);
      overflow: hidden;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
      cursor: pointer;
      animation: floatGlow 4s ease-in-out infinite;
    }

    .portal-card-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    @keyframes floatGlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .enter-btn {
      margin-top: 2rem;
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      color: white;
      border: none;
      padding: 0.85rem 2.2rem;
      border-radius: 30px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* --- MAIN APP SECTION --- */
    header { text-align: center; margin-bottom: 1rem; }
    h1 { font-size: 2.2rem; color: var(--accent); }
    p.subtitle { color: var(--text-sub); font-size: 0.95rem; font-style: italic; }

    .container {
      max-width: 1200px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      opacity: 0;
      transition: opacity 1.5s ease 0.5s;
    }

    .container.visible { opacity: 1; }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    button.action-btn, button.shuffle-btn, button.clarifier-btn {
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      color: white;
      border: none;
      padding: 0.75rem 1.4rem;
      border-radius: 25px;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
      transition: all 0.3s ease;
    }

    button.shuffle-btn {
      background: linear-gradient(135deg, #e879f9, #a855f7);
    }

    button.clarifier-btn {
      background: linear-gradient(135deg, #c084fc, #7e22ce);
      margin-top: 1rem;
      padding: 0.8rem 1.8rem;
    }

    button.clarifier-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    button.reset-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 0.75rem 1.4rem;
      border-radius: 25px;
      cursor: pointer;
    }

    .instruction-text {
      font-size: 1.1rem;
      color: var(--accent);
      text-align: center;
      min-height: 1.5rem;
      margin: 0.5rem 0;
    }

    /* --- FAN DECK --- */
    .fan-deck-container {
      width: 100%;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 1rem 0;
      overflow-x: auto;
      padding: 10px 0;
    }

    .fan-card {
      width: 90px;
      height: 155px;
      position: absolute;
      border-radius: 6px;
      border: 1px solid rgba(216, 180, 254, 0.4);
      box-shadow: -2px 0 8px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.3s ease, margin-top 0.3s ease;
    }

    .fan-card:hover {
      transform: translateY(-20px) scale(1.08) !important;
      z-index: 100 !important;
      box-shadow: 0 10px 20px rgba(216, 180, 254, 0.5);
    }

    .fan-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 5px;
    }

    .fan-card.selected {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50px) scale(0.5) !important;
    }

    /* --- STANDARD GRID & CELTIC CROSS LAYOUT --- */
    .cards-grid {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      width: 100%;
      margin-top: 1rem;
      min-height: 380px;
    }

    .card-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      perspective: 1000px;
      text-align: center;
    }

    .card-title {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: bold;
    }

    .card-desc {
      font-size: 0.68rem;
      color: var(--text-sub);
      font-style: italic;
      max-width: 130px;
      line-height: 1.2;
    }

    .celtic-cross-layout {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4rem;
      width: 100%;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .celtic-cross-circle {
      position: relative;
      width: 500px;
      height: 640px;
    }

    .celtic-cross-circle .card-item[data-pos="1"] {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1;
    }
    .celtic-cross-circle .card-item[data-pos="2"] {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(90deg); z-index: 2;
    }
    .celtic-cross-circle .card-item[data-pos="3"] { position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
    .celtic-cross-circle .card-item[data-pos="4"] { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
    .celtic-cross-circle .card-item[data-pos="5"] { position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
    .celtic-cross-circle .card-item[data-pos="6"] { position: absolute; left: 0; top: 50%; transform: translateY(-50%); }

    .celtic-cross-staff { display: flex; flex-direction: column-reverse; gap: 1rem; }

    /* --- 3D FLIP --- */
    .card-flip-container {
      width: 125px;
      height: 215px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
    }

    .cards-grid .card-flip-container { width: 160px; height: 275px; }
    .card-flip-container.flipped { transform: rotateY(180deg); }
    .celtic-cross-circle .card-item[data-pos="2"] .card-flip-container.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 8px;
      border: 1px solid rgba(216, 180, 254, 0.25);
      overflow: hidden; background-color: var(--card-bg);
    }

    .card-face img { width: 100%; height: 100%; object-fit: cover; }
    .card-back { transform: rotateY(0deg); }
    .card-front { transform: rotateY(180deg); }
    .card-name-text { font-size: 0.8rem; max-width: 130px; text-align: center; color: var(--text-main); margin-top: 2px; }

    /* --- RESPONSIVE FOR MOBILE (IPHONE) --- */
    @media (max-width: 768px) {
      .celtic-cross-layout {
        gap: 2rem;
      }
      .celtic-cross-circle {
        width: 310px;
        height: 440px;
      }
      .card-flip-container {
        width: 95px;
        height: 162px;
      }
      .card-title {
        font-size: 0.65rem;
      }
      .card-desc {
        font-size: 0.58rem;
        max-width: 95px;
      }
      .card-name-text {
        font-size: 0.7rem;
        max-width: 95px;
      }
    }

    /* --- CLARIFIER SECTION --- */
    .clarifier-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px dashed rgba(216, 180, 254, 0.3);
    }
  </style>
